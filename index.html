<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>오늘의 영어 · 단어 목록 (이미지 제외)</title>
<meta name="theme-color" content="#f6f7fb" />
<style>
:root{
  --bg:#f6f7fb; --paper:#fff; --ink:#22283a; --muted:#6f7688;
  --accent:#6259d9; --light:#efedff; --line:#e8eaf2;
  --green:#e2f7eb; --red:#ffeded; --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60}
.brand{font-weight:900;font-size:18px}
.nav{display:flex;gap:8px;align-items:center}
.tab{background:transparent;border:0;padding:8px 12px;border-radius:9px;color:var(--muted);font-weight:800;cursor:pointer}
.tab.active{background:var(--light);color:var(--accent)}
.container{max-width:1180px;margin:20px auto;padding:0 18px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.input{padding:10px;border-radius:10px;border:1px solid var(--line);flex:1;min-width:220px}
.small{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--accent);cursor:pointer;font-weight:800}
.exportBtn{background:var(--accent);color:#fff;border:0;padding:8px 12px;border-radius:9px;font-weight:800;cursor:pointer}

/* list view */
.view { background:transparent; min-height:60vh; }
.list-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap:14px;
  align-items:start;
}

/* list-card (no images) */
.list-card{
  background:#fff;border-radius:10px;border:1px solid #eef0f6;padding:16px;display:flex;flex-direction:column;gap:10px;
  box-shadow: 0 4px 18px rgba(8,10,30,0.04);
}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.word-title{font-weight:900;font-size:18px}
.pron{font-size:13px;color:var(--muted);font-weight:700}
.meta-row{display:flex;gap:10px;flex-wrap:wrap}
.meta-pill{background:var(--light);color:var(--accent);padding:6px 10px;border-radius:10px;font-weight:800;font-size:13px}
.block {background:#fafbfd;border:1px solid #f0f2fb;padding:10px;border-radius:8px}
.small-meta{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px}

/* Fullscreen quiz modal */
#quizModalBackdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,30,0.55);z-index:130}
#quizModal{width:92vw;height:86vh;background:var(--paper);border-radius:12px;padding:18px;overflow:auto;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,0.3);display:flex;flex-direction:column}
#quizHeader{display:flex;justify-content:space-between;align-items:center}
#quizQuestionBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.quizChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:900px;margin-top:18px}
.choiceBtn{padding:16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;cursor:pointer}
.choiceBtn.correct{background:var(--green);border-color:#8ad1a4}
.choiceBtn.wrong{background:var(--red);border-color:#e8a0a0}

/* panel (draggable small) */
.panel {
  position:fixed;
  width:360px;
  min-height:120px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.08);
  box-shadow:0 8px 30px rgba(10,12,30,0.08);
  border-radius:10px;
  z-index:80;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.panel .head {background:var(--accent);color:#fff;padding:8px;cursor:move;display:flex;justify-content:space-between;align-items:center}
.panel .body {padding:10px;overflow:auto;max-height:60vh}
.closePanel{background:transparent;border:0;color:#fff;font-weight:900;cursor:pointer}

/* responsive */
@media(max-width:760px){
  .list-grid{grid-template-columns:repeat(auto-fit,minmax(100%,1fr))}
  .panel{width:92%}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">오늘의 <span style="color:var(--accent)">영어</span></div>
  <nav class="nav" aria-label="메뉴">
    <button class="tab active" data-view="vocab">단어 목록(확대)</button>
    <button class="tab" data-view="today">오늘의 20</button>
    <button class="tab" data-view="quiz">퀴즈</button>
    <button class="tab" data-view="sentences">회화 예문</button>
    <button class="exportBtn" id="exportView">Export view</button>
  </nav>
</header>

<main class="container">
  <div class="toolbar" id="toolbar">
    <input id="globalSearch" class="input" placeholder="검색: 영어/한국어/예문/유의어/반의어/다의어/발음" />
    <label style="display:flex;align-items:center;gap:6px;color:var(--muted)"><input type="checkbox" id="allowDupChk"> 오늘 중복 허용</label>
    <label style="display:flex;align-items:center;gap:6px;color:var(--muted)"><input type="checkbox" id="enableTTS" checked> 스피커 켜기</label>
    <button class="small" id="openQuizPanel">퀴즈 창 열기</button>
  </div>

  <!-- Views -->
  <section id="vocab" class="view">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2>전체 단어 목록 (이미지 없음)</h2>
      <div style="color:var(--muted)">단어 · 발음 · 유의어 · 반의어 · 관련형 · 다의어(뜻)를 크게 표시</div>
    </div>

    <!-- MAIN: large list view (no images) -->
    <div id="listGrid" class="list-grid" aria-live="polite"></div>
  </section>

  <section id="today" class="view" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2>오늘의 20단어</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="small" id="regenTodayBtn">다시 생성</button>
        <button class="small" id="openTodayPanel">오늘 창 열기</button>
      </div>
    </div>
    <div id="todayList" class="today-list"></div>
  </section>

  <section id="quiz" class="view" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2>퀴즈</h2>
      <div style="color:var(--muted)">전체화면 퀴즈로 풀려면 '퀴즈 창 열기' 클릭</div>
    </div>
    <div id="quizArea" style="background:#fff;border:1px solid var(--line);padding:14px;border-radius:10px">
      <div id="mcQuestion" style="font-weight:900;font-size:20px">퀴즈를 시작하세요</div>
      <div id="mcAnswers" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px"></div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="small" id="mcNext" disabled>다음</button>
        <button class="small" id="mcStart">시작</button>
        <button class="small" id="openQuizWindow">퀴즈 창 열기</button>
      </div>
      <div id="mcFeedback" style="margin-top:10px;font-weight:800;color:var(--muted)"></div>
    </div>
  </section>

  <section id="sentences" class="view" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2>회화 예문</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <div style="color:var(--muted)">20개씩 랜덤 생성 · 재생성 가능</div>
        <button class="small" id="regenSentBtn">예문 다시 생성</button>
      </div>
    </div>
    <div id="sentList" style="display:grid;gap:8px"></div>
  </section>
</main>

<!-- Fullscreen quiz modal -->
<div id="quizModalBackdrop" aria-hidden="true">
  <div id="quizModal" role="dialog" aria-modal="true">
    <div id="quizHeader">
      <div style="font-weight:900" id="quizTitle">퀴즈 대화형 (전체화면)</div>
      <div><button class="small" id="closeQuizModal">닫기 ✕</button></div>
    </div>
    <div id="quizQuestionBox">
      <div id="fullQ" style="font-size:34px;font-weight:900">Ready?</div>
      <div id="fullQsub" style="color:var(--muted);margin-top:8px">보기에서 정답을 골라 보세요.</div>
      <div class="quizChoices" id="fullChoices"></div>
      <div id="fullFeedback" style="margin-top:18px;font-weight:800;color:var(--muted)"></div>
      <div style="margin-top:18px;display:flex;gap:8px">
        <button class="small" id="fullNext" disabled>다음 →</button>
        <button class="small" id="fullStart">시작</button>
      </div>
    </div>
  </div>
</div>

<div id="panelsRoot"></div>

<script>
/* ===============================
   이미지 제거 버전
   - 메인 리스트는 이미지없이 단어+발음+유의어+반의어+관련형+다의어만 표시
   - 기존 기능(검색, TTS, 오늘의 20, 예문 20 랜덤 재생성, 전체화면 퀴즈 등) 유지
   =============================== */

/* helpers */
function $(id){ return document.getElementById(id); }
function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function escapeForInline(s){ return (s||'').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

/* --- base words + userList merge + enrichment (same logic as before) --- */
let words = [
  {en:"Appreciate", ko:"고마워하다", pron:"əˈpriːʃieɪt", cat:"동사", ex:"I really appreciate your advice."},
  {en:"Hesitate", ko:"망설이다", pron:"ˈhɛzɪteɪt", cat:"동사", ex:"Don't hesitate to ask questions."},
  {en:"Consider", ko:"고려하다", pron:"kənˈsɪdər", cat:"동사", ex:"I'll consider your suggestion."},
  {en:"Manage", ko:"해내다", pron:"ˈmænɪdʒ", cat:"동사", ex:"I managed to finish it on time."},
  {en:"Realize", ko:"깨닫다", pron:"ˈriːəlaɪz", cat:"동사", ex:"I realized I was wrong."},
  {en:"Avoid", ko:"피하다", pron:"əˈvɔɪd", cat:"동사", ex:"I try to avoid making the same mistake."},
  {en:"Recommend", ko:"추천하다", pron:"ˌrɛkəˈmɛnd", cat:"동사", ex:"Would you recommend this book."},
  {en:"Reliable", ko:"믿을 수 있는", pron:"rɪˈlaɪəbl", cat:"형용사", ex:"She's a reliable friend."},
  {en:"Confident", ko:"자신감 있는", pron:"ˈkɒnfɪdənt", cat:"감정", ex:"I feel more confident now."},
  {en:"Awkward", ko:"어색한", pron:"ˈɔːkwəd", cat:"형용사", ex:"There was an awkward silence."},
  {en:"Figure out", ko:"알아내다", pron:"ˈfɪɡər aʊt", cat:"숙어", ex:"I'll figure out how it works."},
  {en:"Give up", ko:"포기하다", pron:"ɡɪv ʌp", cat:"숙어", ex:"Don't give up too easily."}
];

const userList = [
  {en:"persuade", ko:"설득하다"},{en:"gaze", ko:"응시하다"},{en:"restore", ko:"회복시키다"},{en:"heal", ko:"고치다"},
  {en:"acquire", ko:"얻다"},{en:"halt", ko:"서다 (정지)"},{en:"maintain", ko:"유지하다, 주장하다"},{en:"mourn", ko:"슬퍼하다"},
  {en:"suspect", ko:"의심하다"},{en:"grumble", ko:"불평하다"},{en:"entertain", ko:"즐겁게 하다"},{en:"utilize", ko:"이용하다"},
  {en:"convert", ko:"바꾸다"},{en:"despise", ko:"경멸하다"},{en:"commence", ko:"시작하다"},{en:"consume", ko:"소비하다"},
  {en:"assimilate", ko:"동화하다"},{en:"impose", ko:"부과하다, 강요하다"},{en:"encounter", ko:"만나다"},{en:"release", ko:"해방하다, 면제하다"},
  {en:"specialize", ko:"전공하다, 전문화하다"},{en:"respond", ko:"응답하다"},{en:"soar", ko:"치솟다"},{en:"comprehend", ko:"이해하다, 포함하다"},
  {en:"detect", ko:"발견하다"},{en:"qualify", ko:"자격을 주다"},{en:"decorate", ko:"장식하다"},{en:"accelerate", ko:"속도를 더하다"},
  {en:"betray", ko:"배반하다, 누설하다"},{en:"dominate", ko:"통치하다, 지배하다"},{en:"preserve", ko:"유지하다, 보존하다"},{en:"entreat", ko:"간청하다"},
  {en:"lack", ko:"부족하다"},{en:"interrupt", ko:"방해하다, 중단하다"},{en:"surpass", ko:"우월하다"},{en:"render", ko:"되게 하다, 주다"},
  {en:"export", ko:"수출하다"},{en:"fulfill", ko:"실행하다, 이행하다"},{en:"inspect", ko:"검사하다"},{en:"indulge", ko:"탐닉하다"},
  {en:"prevail", ko:"유행하다, 우세하다"},{en:"adjust", ko:"적응시키다"},{en:"estimate", ko:"평가하다"},{en:"compensate", ko:"배상하다"},
  {en:"restrain", ko:"제한하다, 억제하다"},{en:"appreciate", ko:"감상하다, 감사하다"},{en:"insist", ko:"주장하다"},{en:"acknowledge", ko:"인정하다"},
  {en:"distinguish", ko:"구별하다"},{en:"involve", ko:"포함하다"},{en:"intrude", ko:"침입하다"},{en:"torment", ko:"고문하다, 괴롭히다"},
  {en:"exhaust", ko:"지치게 하다"},{en:"endure", ko:"견디다"},{en:"hesitate", ko:"주저하다"},{en:"substitute", ko:"대신하다, 대체하다"},
  {en:"prohibit", ko:"금하다"},{en:"forbid", ko:"금하다"},{en:"display", ko:"진열하다, 전시하다"},{en:"concentrate", ko:"집중하다"},
  {en:"yearn", ko:"그리워하다"},{en:"forsake", ko:"버리다"},{en:"endeavor", ko:"노력하다"},{en:"soothe", ko:"위로하다"},
  {en:"congratulate", ko:"축하하다"},{en:"confuse", ko:"혼란시키다"},{en:"improve", ko:"개선하다"},{en:"diffuse", ko:"보급하다, 퍼뜨리다"},
  {en:"alter", ko:"바꾸다"},{en:"speculate", ko:"사색하다, 추측하다"},{en:"recover", ko:"회복하다"},{en:"urge", ko:"촉구하다, 역설하다"},
  {en:"command", ko:"명령하다, 지휘하다"},{en:"warn", ko:"경고하다"},{en:"transport", ko:"수송하다"},{en:"ignore", ko:"무시하다"},
  {en:"conceal", ko:"감추다"},{en:"utter", ko:"말하다; 완전한"},{en:"flatter", ko:"아첨하다"},{en:"absorb", ko:"흡수하다, 열중하다"},
  {en:"yield", ko:"양보하다, 굴복하다"},{en:"meditate", ko:"숙고하다"},{en:"perform", ko:"수행하다, 연기하다"},{en:"embarrass", ko:"난처하게 하다"},
  {en:"reproach", ko:"비난하다"},{en:"bewilder", ko:"당황하게 하다"},{en:"overcome", ko:"극복하다"},{en:"assert", ko:"주장하다"},
  {en:"recognize", ko:"인식하다"},{en:"admit", ko:"인정하다"},{en:"persecute", ko:"박해하다"},{en:"launch", ko:"출시하다, 시작하다"},
  {en:"pretend", ko:"~인 체하다"},{en:"circulate", ko:"순환하다, 유통하다"},{en:"contemplate", ko:"깊이 생각하다"},{en:"cope", ko:"대처하다, 맞서다"},
  {en:"adapt", ko:"적응시키다"},{en:"alarm", ko:"놀라게 하다"},{en:"adopt", ko:"채택하다, 입양하다"},{en:"submit", ko:"복종시키다, 제출하다"}
];

/* small maps (kept concise) */
const synonymsMap = {
  persuade:["convince","influence","sway"], gaze:["stare","peer","look"], restore:["recover","renew","repair"], heal:["cure","mend","remedy"],
  acquire:["obtain","gain","procure"], halt:["stop","cease","pause"], maintain:["preserve","sustain","keep"], mourn:["grieve","lament","bewail"]
  /* ... 필요하면 더 추가 */
};
const antonymsMap = {
  persuade:["dissuade","discourage"], gaze:["look away"], restore:["ruin","destroy"], heal:["harm","injure"], acquire:["lose"]
  /* ... 필요하면 더 추가 */
};

function generatePron(word){
  if(!word) return '';
  const w = word.toLowerCase();
  let out = w.replace(/tion$/,'ʃən').replace(/ph/g,'f').replace(/ough/g,'oʊ').replace(/ea/g,'iː').replace(/ie/g,'aɪ').replace(/th/g,'θ');
  out = out.replace(/([aeiou])/g, function(m){
    if(m==='a') return 'æ';
    if(m==='e') return 'ɛ';
    if(m==='i') return 'ɪ';
    if(m==='o') return 'ɒ';
    if(m==='u') return 'ʌ';
    return m;
  });
  return '/' + out + '/';
}
function genSenses(word){
  const b = word.toLowerCase();
  if(synonymsMap[b]) return ["to " + b, "similar to " + synonymsMap[b][0]];
  return ["to " + b, "the act of " + b];
}
function genRelated(word){
  const base = word.toLowerCase().replace(/ing$|ed$|s$/,'');
  const arr = [base, base + "ion", base + "er", base + "able"];
  return Array.from(new Set(arr)).slice(0,4);
}

/* merge & enrich */
(function enrichAll(){
  const exist = new Set(words.map(w=>w.en.toLowerCase()));
  userList.forEach(item=>{
    const key = item.en.toLowerCase();
    if(exist.has(key)) return;
    const en = item.en.charAt(0).toUpperCase() + item.en.slice(1);
    words.push({
      en,
      ko: item.ko || '',
      pron: generatePron(item.en),
      synonyms: (synonymsMap && synonymsMap[key]) ? synonymsMap[key].slice(0,6) : [item.en],
      antonyms: (antonymsMap && antonymsMap[key]) ? antonymsMap[key].slice(0,6) : [],
      senses: genSenses(item.en),
      related: genRelated(item.en),
      cat: '동사',
      ex: item.en.includes(' ') ? `I often ${item.en}.` : `I ${item.en} it.`
    });
    exist.add(key);
  });

  words = words.map(w=>{
    const key = (w.en||'').toLowerCase();
    if(!w.pron) w.pron = generatePron(w.en);
    if(!w.synonyms || !w.synonyms.length) w.synonyms = (synonymsMap && synonymsMap[key]) ? synonymsMap[key].slice(0,6) : [key];
    if(!w.antonyms || !w.antonyms.length) w.antonyms = (antonymsMap && antonymsMap[key]) ? antonymsMap[key].slice(0,6) : [];
    if(!w.senses || !w.senses.length) w.senses = genSenses(w.en);
    if(!w.related || !w.related.length) w.related = genRelated(w.en);
    if(!w.ex) w.ex = w.en.includes(' ') ? `I often ${key}.` : `I ${key} it.`;
    w.enLower = (w.en||'').toLowerCase();
    w.koLower = (w.ko||'').toLowerCase();
    w.exLower = (w.ex||'').toLowerCase();
    w.synText = (w.synonyms||[]).join(' ').toLowerCase();
    w.antText = (w.antonyms||[]).join(' ').toLowerCase();
    w.senseText = (w.senses||[]).join(' ').toLowerCase();
    w.relText = (w.related||[]).join(' ').toLowerCase();
    return w;
  });
})();

/* sentence pool and storage (same as before) */
const SENT_STORE_KEY = "oneul_sentences_v1";
const sentencesPool = [
  {en:"How have you been?", ko:"그동안 어떻게 지냈어요?"},{en:"Long time no see.", ko:"오랜만이에요."},
  {en:"What's new with you?", ko:"요즘 어때요?"},{en:"I can't wait to see you.", ko:"당신을 빨리 보고 싶어요."},
  {en:"Let's grab a coffee sometime.", ko:"언제 커피 한잔 하자."},{en:"Could you give me a hand?", ko:"도와주실 수 있나요?"},
  {en:"I'm sorry, I didn't catch that.", ko:"죄송해요, 그 말 못 들었어요."},{en:"Can you repeat that, please?", ko:"다시 말씀해 주시겠어요?"},
  {en:"That sounds great!", ko:"좋게 들리네요!"},{en:"I'm looking forward to it.", ko:"그것이 기대돼요."},
  {en:"No problem at all.", ko:"전혀 문제없어요."},{en:"What do you think about this?", ko:"이것에 대해 어떻게 생각하세요?"},
  {en:"I totally agree with you.", ko:"저도 전적으로 동의해요."},{en:"I'm not sure about that.", ko:"그건 잘 모르겠어요."},
  {en:"Let me check and get back to you.", ko:"확인해보고 다시 알려드릴게요."},{en:"Sorry for the inconvenience.", ko:"불편을 끼쳐 죄송합니다."},
  {en:"Do you have any plans this weekend?", ko:"이번 주말에 계획 있어요?"},{en:"That's very kind of you.", ko:"정말 친절하시네요."},
  {en:"Could we reschedule?", ko:"일정을 바꿀 수 있을까요?"},{en:"I'll be right back.", ko:"금방 돌아올게요."},

];
function sampleSentences(count = 20){
  const pool = sentencesPool.slice();
  if(pool.length <= count) return shuffle(pool);
  return shuffle(pool).slice(0, count);
}
function regenerateSentences(){
  const date = new Date().toISOString().slice(0,10);
  const list = sampleSentences(20);
  try{ localStorage.setItem(SENT_STORE_KEY, JSON.stringify({date, list})); }catch(e){}
  renderSentences();
}
function getSentenceList(){
  try{
    const raw = localStorage.getItem(SENT_STORE_KEY);
    const today = new Date().toISOString().slice(0,10);
    if(!raw){ regenerateSentences(); return JSON.parse(localStorage.getItem(SENT_STORE_KEY)).list; }
    const parsed = JSON.parse(raw);
    if(!parsed || parsed.date !== today){ regenerateSentences(); return JSON.parse(localStorage.getItem(SENT_STORE_KEY)).list; }
    return parsed.list;
  }catch(e){ regenerateSentences(); return JSON.parse(localStorage.getItem(SENT_STORE_KEY)).list; }
}

/* TTS */
function speak(text){
  if(!("speechSynthesis" in window)) return;
  if(!document.getElementById('enableTTS').checked) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.92;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(x=>x.lang==="en-US") || voices.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* render main list view (no images) */
function renderListView(){
  const grid = $('listGrid'); if(!grid) return;
  const q = ($('globalSearch').value||'').trim().toLowerCase();
  const filtered = words.filter(w=>{
    if(!q) return true;
    const hay = [w.enLower,w.koLower,w.exLower,w.synText||'',w.antText||'',w.senseText||'',w.relText||'',(w.pron||'').toLowerCase()].join(' ');
    return hay.includes(q);
  });
  grid.innerHTML = '';
  if(filtered.length === 0){
    grid.innerHTML = '<div style="grid-column:1/-1;padding:20px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--muted)">검색 결과가 없습니다.</div>';
    return;
  }
  filtered.forEach(w=>{
    const card = document.createElement('div'); card.className='list-card';
    const body = document.createElement('div'); body.className='body';
    const titleRow = document.createElement('div'); titleRow.className='title-row';
    const title = document.createElement('div'); title.className='word-title'; title.textContent = w.en;
    const pron = document.createElement('div'); pron.className='pron'; pron.textContent = w.pron || '';
    titleRow.append(title, pron);
    const ko = document.createElement('div'); ko.className='small-meta'; ko.textContent = w.ko || '';
    const synBlock = document.createElement('div'); synBlock.className='block'; synBlock.innerHTML = `<strong>유의어:</strong> ${(w.synonyms||[]).slice(0,6).join(', ') || '없음'}`;
    const antBlock = document.createElement('div'); antBlock.className='block'; antBlock.innerHTML = `<strong>반의어:</strong> ${(w.antonyms||[]).slice(0,6).join(', ') || '없음'}`;
    const relBlock = document.createElement('div'); relBlock.className='block'; relBlock.innerHTML = `<strong>관련형:</strong> ${(w.related||[]).join(', ') || '없음'}`;
    const senseBlock = document.createElement('div'); senseBlock.className='block'; senseBlock.innerHTML = `<strong>다의어(뜻):</strong> ${(w.senses||[]).join(' / ') || '없음'}`;
    const ex = document.createElement('div'); ex.className='small-meta'; ex.style.marginTop='6px'; ex.textContent = w.ex || '';
    const actions = document.createElement('div'); actions.className='actions';
    const bPlay = document.createElement('button'); bPlay.className='small'; bPlay.textContent='🔊 발음'; bPlay.onclick = ()=>speak(w.en);
    const bPanel = document.createElement('button'); bPanel.className='small'; bPanel.textContent='상세 창'; bPanel.onclick = ()=>openPanelForWord(w);
    actions.append(bPlay,bPanel);

    body.append(titleRow, ko, synBlock, antBlock, relBlock, senseBlock, ex, actions);
    card.append(body);
    grid.appendChild(card);
  });
}

/* render sentences list */
function renderSentences(){
  const root = $('sentList'); if(!root) return;
  root.innerHTML = '';
  const list = getSentenceList();
  list.forEach((s,i)=>{
    const el = document.createElement('div'); el.style.background='#fff'; el.style.border='1px solid var(--line)'; el.style.padding='12px'; el.style.borderRadius='10px';
    el.innerHTML = `<div style="font-weight:800">${s.en}</div><div style="color:var(--muted)">${s.ko}</div>`;
    const btn = document.createElement('button'); btn.className='small'; btn.textContent='예문 듣기'; btn.style.marginTop='8px'; btn.onclick=()=>speak(s.en);
    el.appendChild(btn);
    root.appendChild(el);
  });
}
$('regenSentBtn').addEventListener('click', ()=>{ regenerateSentences(); });

/* Today list + regen */
const TODAY_KEY = 'oneul_today_v2000';
function sampleToday(count=20){
  const allowDup = !!document.getElementById('allowDupChk').checked;
  const n = words.length;
  if(allowDup){ const out=[]; for(let i=0;i<count;i++) out.push(words[Math.floor(Math.random()*n)]); return out; }
  return shuffle(words).slice(0,count);
}
function regenerateToday(){
  const nowDate = new Date().toISOString().slice(0,10);
  const list = sampleToday(20);
  try{ localStorage.setItem(TODAY_KEY, JSON.stringify({date:nowDate, list})); }catch(e){}
  renderToday();
}
function getTodayList(){
  try{
    const raw = localStorage.getItem(TODAY_KEY);
    const today = new Date().toISOString().slice(0,10);
    if(!raw){ regenerateToday(); }
    const parsed = JSON.parse(localStorage.getItem(TODAY_KEY));
    if(!parsed || parsed.date !== today){ regenerateToday(); return JSON.parse(localStorage.getItem(TODAY_KEY)).list; }
    return parsed.list;
  }catch(e){ regenerateToday(); return JSON.parse(localStorage.getItem(TODAY_KEY)).list; }
}
function renderToday(){
  const root = $('todayList'); if(!root) return; root.innerHTML = '';
  const list = getTodayList();
  list.forEach((w,i)=>{
    const row = document.createElement('div'); row.className='today-row';
    row.innerHTML = `<div><strong>${i+1}. ${w.en}</strong><div style="color:var(--muted)">${w.ko}</div></div>`;
    const right = document.createElement('div'); right.style.display='flex'; right.style.gap='8px';
    const play = document.createElement('button'); play.className='small'; play.textContent='🔊'; play.onclick=()=>speak(w.en);
    const open = document.createElement('button'); open.className='small'; open.textContent='상세'; open.onclick=()=>openPanelForWord(w);
    right.append(play,open); row.appendChild(right); root.appendChild(row);
  });
}
$('regenTodayBtn') && document.getElementById('regenTodayBtn').addEventListener('click', ()=>regenerateToday());

/* draggable small panel (shows same fields) */
const panelsRoot = document.getElementById('panelsRoot');
let panelCounter = 0;
function openPanel(opts){ const id='panel-'+(panelCounter++); const panel=document.createElement('div'); panel.className='panel'; panel.id=id; panel.style.left=(60+panelCounter*18)+'px'; panel.style.top=(60+panelCounter*12)+'px'; panel.innerHTML=`<div class="head"><div>${opts.title}</div><div><button class="closePanel">✕</button></div></div><div class="body">${opts.html}</div>`; panelsRoot.appendChild(panel); panel.querySelector('.closePanel').addEventListener('click', ()=>panel.remove()); makeDraggable(panel); }
function openPanelForWord(w){
  const html = `
    <div>
      <div style="font-weight:900">${w.en} <span style="color:var(--muted);font-weight:700">${w.pron||''}</span></div>
      <div style="color:var(--muted);margin-top:8px">${w.ko || ''}</div>
      <div style="margin-top:10px"><strong>유의어:</strong> ${(w.synonyms||[]).slice(0,8).join(', ') || '없음'}</div>
      <div><strong>반의어:</strong> ${(w.antonyms||[]).slice(0,8).join(', ') || '없음'}</div>
      <div><strong>관련형:</strong> ${(w.related||[]).join(', ') || '없음'}</div>
      <div><strong>다의어(뜻):</strong> ${(w.senses||[]).join(' / ') || '없음'}</div>
      <div style="margin-top:10px"><button class="small" onclick="window.speak('${escapeForInline(w.en)}')">🔊 발음</button></div>
    </div>
  `;
  openPanel({title:w.en, html});
  if(document.getElementById('enableTTS').checked) speak(w.en);
}
function makeDraggable(panel){ const head=panel.querySelector('.head'); if(!head) return; head.onmousedown=function(e){ e.preventDefault(); let shiftX=e.clientX-panel.getBoundingClientRect().left; let shiftY=e.clientY-panel.getBoundingClientRect().top; function moveAt(pageX,pageY){ panel.style.left=pageX-shiftX+'px'; panel.style.top=pageY-shiftY+'px'; } function onMouseMove(e){ moveAt(e.pageX,e.pageY); } document.addEventListener('mousemove', onMouseMove); document.onmouseup=function(){ document.removeEventListener('mousemove', onMouseMove); document.onmouseup=null; }; }; head.ondragstart=()=>false; }

/* Fullscreen quiz modal (unchanged behavior) */
const quizBackdrop = $('quizModalBackdrop');
function openFullQuiz(){
  quizBackdrop.style.display = 'flex';
  quizBackdrop.setAttribute('aria-hidden','false');
  const qEl = $('fullQ'); const sub = $('fullQsub'); const choicesEl = $('fullChoices'); const feedback = $('fullFeedback'); const nextBtn = $('fullNext'); const startBtn = $('fullStart');
  let deck = shuffle(words).slice(0,10); let idx = 0; let answered=false;
  function renderQuestion(){
    answered=false; nextBtn.disabled=true; feedback.textContent='';
    const w = deck[idx]; qEl.textContent = w.en; sub.textContent = w.ex || ''; choicesEl.innerHTML = '';
    const options = shuffle([w, ...shuffle(words.filter(x=>x.en!==w.en)).slice(0,3)]);
    options.forEach(opt=>{
      const b = document.createElement('button'); b.className='choiceBtn'; b.textContent = opt.ko || opt.en;
      b.onclick = ()=>{
        if(answered) return; answered=true;
        if(opt.en === w.en){ b.classList.add('correct'); feedback.textContent='정답입니다!'; } else { b.classList.add('wrong'); feedback.textContent='오답 — 정답: ' + w.ko; }
        [...choicesEl.querySelectorAll('.choiceBtn')].forEach(btn=>{ if(btn.textContent === w.ko) btn.classList.add('correct'); });
        nextBtn.disabled=false;
      };
      choicesEl.appendChild(b);
    });
    if(document.getElementById('enableTTS').checked) speak(w.en);
  }
  startBtn.onclick = ()=>{ deck = shuffle(words).slice(0,10); idx=0; renderQuestion(); };
  nextBtn.onclick = ()=>{ if(nextBtn.disabled) return; idx++; if(idx>=deck.length){ qEl.textContent='퀴즈 완료!'; choicesEl.innerHTML=''; feedback.textContent='모든 문제를 풀었습니다.'; nextBtn.disabled=true; } else renderQuestion(); };
  renderQuestion();
}
function closeFullQuiz(){ quizBackdrop.style.display='none'; quizBackdrop.setAttribute('aria-hidden','true'); }
$('openQuizPanel').addEventListener('click', ()=>openFullQuiz());
$('openQuizWindow').addEventListener('click', ()=>openFullQuiz());
$('closeQuizModal').addEventListener('click', ()=>closeFullQuiz());
$('mcStart').addEventListener('click', ()=>openFullQuiz());

/* export + tab bindings */
$('exportView').addEventListener('click', ()=>{ const activeTab=document.querySelector('.tab.active'); const viewId=activeTab?activeTab.dataset.view:'vocab'; const viewEl=document.getElementById(viewId); if(!viewEl) return alert('뷰를 찾을 수 없습니다.'); const html=`<!doctype html><html><head><meta charset="utf-8"><title>Exported - ${viewId}</title><style>body{font-family:system-ui;margin:20px;background:#f6f7fb;color:#222} .card{background:#fff;padding:12px;border-radius:8px;border:1px solid #eee;margin-bottom:12px}</style></head><body>${viewEl.outerHTML}</body></html>`; const blob=new Blob([html],{type:'text/html'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`${viewId}.html`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); });

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=> {

});

/* search binding */
$('globalSearch').addEventListener('input', ()=>{ renderListView(); renderSentences(); });

/* initial render */
function layoutAndRender(){ renderListView(); renderToday(); renderSentences(); }
layoutAndRender();

/* expose for debugging */
window._app = { words, renderListView, regenerateToday, regenerateSentences, openFullQuiz };
